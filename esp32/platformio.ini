; ESP32-S3 接收端
; 编译：pio run      烧录：pio run -t upload      串口监视：pio device monitor
;
; 注意：include/config.h 不入库（含 WiFi 密码与 Token）。
; 第一次使用请复制一份：
;   cp include/config_example.h include/config.h
; 然后改里面的 WiFi / Token / 继电器引脚。

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
