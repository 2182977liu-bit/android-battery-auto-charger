name: build-android

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'keystore/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像已自带 Android SDK，不再用 android-actions/setup-android
      # （它的 v3 会执行 `sdkmanager tools`，该包已被官方移除，必定失败）
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || ls -1 "$ANDROID_SDK_ROOT/cmdline-tools" 2>/dev/null || true

      - name: Install SDK components (best effort)
        shell: bash
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ] && [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager=${SDKM:-none}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          # 即便这一步没装成功也没关系：AGP 会在构建时自动补下缺失的 SDK 组件

      # 用 setup-gradle 直接装 Gradle，不依赖仓库里的 gradle-wrapper.jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPhoneZ-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Summary
        run: |
          echo "### APK 构建完成" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "到当前 run 页面底部 Artifacts 区下载 AutoPhoneZ-debug-apk" >> $GITHUB_STEP_SUMMARY
