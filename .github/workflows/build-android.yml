name: build-android

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'keystore/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 用 setup-gradle 直接装 Gradle，不依赖仓库里的 gradle-wrapper.jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPhoneZ-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Summary
        run: |
          echo "### APK 构建完成" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "到当前 run 页面底部 Artifacts 区下载 AutoPhoneZ-debug-apk" >> $GITHUB_STEP_SUMMARY
