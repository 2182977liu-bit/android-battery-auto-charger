name: build-android

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'keystore/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像已自带 Android SDK，不再用 android-actions/setup-android
      # （它的 v3 会执行 `sdkmanager tools`，该包已被官方移除，必定失败）
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || ls -1 "$ANDROID_SDK_ROOT/cmdline-tools" 2>/dev/null || true

      - name: Install SDK components (best effort)
        shell: bash
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ] && [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager=${SDKM:-none}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          # 即便这一步没装成功也没关系：AGP 会在构建时自动补下缺失的 SDK 组件

      # 用 setup-gradle 直接装 Gradle，不依赖仓库里的 gradle-wrapper.jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPhoneZ-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Summary
        run: |
          echo "### APK 构建完成" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "到当前 run 页面底部 Artifacts 区下载 AutoPhoneZ-debug-apk" >> $GITHUB_STEP_SUMMARY

      # 自动发版：tag 用 versionName，App 端就是拿这个 tag 比版本的。
      # App 会请求 releases/latest 找 .apk 资产，所以这里必须传 APK 上去。
      - name: Read version
        id: ver
        shell: bash
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "读取到 versionName=$VN versionCode=$VC"

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VN="${{ steps.ver.outputs.versionName }}"
          TAG="v$VN"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          # App 靠 releases/latest/download/version.txt 判断版本，
          # 走静态 CDN，不碰 api.github.com 的 60 次/小时配额。
          printf '%s\n' "$VN" > version.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" version.txt --clobber
            echo "已更新已有 Release $TAG"
          else
            gh release create "$TAG" "$APK" version.txt \
              --title "AutoPhoneZ v$VN" \
              --notes "versionCode ${{ steps.ver.outputs.versionCode }} 自动构建"
            echo "已创建 Release $TAG"
          fi

      - name: Verify direct links
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          VN=$(curl -sL "$BASE/version.txt" | tr -d '\r\n ')
          echo "latest/download/version.txt -> [$VN]"
          curl -sL -o /tmp/check.apk "$BASE/app-debug.apk"
          ls -l /tmp/check.apk
